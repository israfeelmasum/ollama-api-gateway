<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg3)"/>

  <!-- Browser chrome -->
  <rect x="20" y="20" width="1160" height="680" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="20" y="20" width="1160" height="40" rx="12" fill="#1e293b"/>
  <circle cx="42" cy="40" r="6" fill="#ef4444"/>
  <circle cx="62" cy="40" r="6" fill="#f59e0b"/>
  <circle cx="82" cy="40" r="6" fill="#10b981"/>
  <rect x="120" y="30" width="600" height="20" rx="10" fill="#0f172a"/>
  <text x="135" y="44" fill="#64748b" font-size="11">🔒 ollama-api-gateway / playground / index.html</text>

  <!-- Header -->
  <rect x="20" y="60" width="1160" height="60" fill="rgba(15,23,42,.5)"/>
  <text x="44" y="98" fill="#f1f5f9" font-size="18" font-weight="700">🚀 Ollama API Gateway</text>
  <rect x="232" y="84" width="100" height="22" rx="11" fill="rgba(16,185,129,.15)" stroke="#10b981"/>
  <text x="282" y="99" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">Live Playground</text>
  <text x="1140" y="98" text-anchor="end" fill="#94a3b8" font-size="12">GitHub →</text>

  <!-- Sidebar -->
  <rect x="20" y="120" width="280" height="580" fill="rgba(15,23,42,.4)" stroke="#334155"/>
  <text x="40" y="148" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">CONFIGURATION</text>

  <text x="40" y="176" fill="#94a3b8" font-size="11">API Base URL</text>
  <rect x="40" y="184" width="240" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="206" fill="#e2e8f0" font-size="12" font-family="ui-monospace,monospace">http://localhost:8002</text>

  <text x="40" y="240" fill="#94a3b8" font-size="11">API Key</text>
  <rect x="40" y="248" width="240" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="52" y="270" fill="#94a3b8" font-size="12" font-family="ui-monospace,monospace">••••••••••••••••</text>

  <rect x="40" y="296" width="240" height="38" rx="8" fill="#10b981"/>
  <text x="160" y="320" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Test Connection</text>

  <rect x="40" y="346" width="240" height="32" rx="8" fill="rgba(16,185,129,.12)" stroke="rgba(16,185,129,.3)"/>
  <circle cx="56" cy="362" r="4" fill="#10b981"/>
  <text x="68" y="366" fill="#10b981" font-size="11">Connected · ollama=true</text>

  <text x="40" y="404" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">ENDPOINTS</text>

  <rect x="36" y="416" width="248" height="32" rx="8" fill="rgba(16,185,129,.12)"/>
  <text x="48" y="436" fill="#10b981" font-size="13">💬  Chat Completion</text>

  <text x="48" y="466" fill="#94a3b8" font-size="13">⚡  Streaming Chat</text>
  <text x="48" y="490" fill="#94a3b8" font-size="13">📊  Embeddings</text>
  <text x="48" y="514" fill="#94a3b8" font-size="13">📦  Batch Embeddings</text>
  <text x="48" y="538" fill="#94a3b8" font-size="13">🖼️  Vision</text>
  <text x="48" y="562" fill="#94a3b8" font-size="13">📋  Models</text>
  <text x="48" y="586" fill="#94a3b8" font-size="13">🛠️  Raw Request</text>

  <!-- Main panel -->
  <text x="320" y="160" fill="#f1f5f9" font-size="22" font-weight="700">Chat Completion</text>
  <rect x="510" y="142" width="270" height="22" rx="11" fill="rgba(16,185,129,.15)"/>
  <text x="645" y="158" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600" font-family="ui-monospace,monospace">POST /api/v1/chat/completions</text>
  <text x="320" y="184" fill="#94a3b8" font-size="13">Send a multi-turn conversation and get a complete response.</text>

  <!-- Form fields -->
  <text x="320" y="216" fill="#94a3b8" font-size="11">Model</text>
  <rect x="320" y="224" width="380" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="332" y="246" fill="#e2e8f0" font-size="12" font-family="ui-monospace,monospace">llama3.2</text>

  <text x="720" y="216" fill="#94a3b8" font-size="11">Temperature: 0.7</text>
  <rect x="720" y="232" width="240" height="4" rx="2" fill="#334155"/>
  <rect x="720" y="232" width="84" height="4" rx="2" fill="#10b981"/>
  <circle cx="804" cy="234" r="7" fill="#10b981"/>

  <text x="320" y="282" fill="#94a3b8" font-size="11">System message</text>
  <rect x="320" y="290" width="640" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="332" y="312" fill="#e2e8f0" font-size="12" font-family="ui-monospace,monospace">You are a helpful AI assistant. Keep responses concise.</text>

  <text x="320" y="362" fill="#94a3b8" font-size="11">User message</text>
  <rect x="320" y="370" width="640" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="332" y="392" fill="#e2e8f0" font-size="12" font-family="ui-monospace,monospace">What is machine learning? Explain in 2 sentences.</text>

  <rect x="320" y="438" width="140" height="38" rx="8" fill="#10b981"/>
  <text x="390" y="462" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Send Request →</text>

  <!-- Response -->
  <rect x="320" y="492" width="840" height="180" rx="8" fill="#020617" stroke="#334155"/>
  <text x="336" y="516" fill="#7dd3fc" font-size="12" font-family="ui-monospace,monospace">{</text>
  <text x="348" y="536" fill="#7dd3fc" font-size="12" font-family="ui-monospace,monospace">"model"</text>
  <text x="412" y="536" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace">: </text>
  <text x="428" y="536" fill="#fbbf24" font-size="12" font-family="ui-monospace,monospace">"llama3.2"</text>
  <text x="500" y="536" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace">,</text>

  <text x="348" y="556" fill="#7dd3fc" font-size="12" font-family="ui-monospace,monospace">"message"</text>
  <text x="424" y="556" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace">: { </text>
  <text x="456" y="556" fill="#7dd3fc" font-size="12" font-family="ui-monospace,monospace">"role"</text>
  <text x="504" y="556" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace">: </text>
  <text x="520" y="556" fill="#fbbf24" font-size="12" font-family="ui-monospace,monospace">"assistant"</text>
  <text x="600" y="556" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace">,</text>

  <text x="368" y="576" fill="#7dd3fc" font-size="12" font-family="ui-monospace,monospace">"content"</text>
  <text x="438" y="576" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace">: </text>
  <text x="454" y="576" fill="#fbbf24" font-size="12" font-family="ui-monospace,monospace">"Machine learning is a branch of AI where systems learn</text>
  <text x="368" y="596" fill="#fbbf24" font-size="12" font-family="ui-monospace,monospace">patterns from data instead of being explicitly programmed. It powers</text>
  <text x="368" y="616" fill="#fbbf24" font-size="12" font-family="ui-monospace,monospace">applications like recommendations, image recognition, and chatbots."</text>
  <text x="348" y="636" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace"> },</text>
  <text x="348" y="656" fill="#7dd3fc" font-size="12" font-family="ui-monospace,monospace">"eval_count"</text>
  <text x="438" y="656" fill="#cbd5e1" font-size="12" font-family="ui-monospace,monospace">: </text>
  <text x="454" y="656" fill="#a78bfa" font-size="12" font-family="ui-monospace,monospace">42</text>

  <!-- Stats -->
  <text x="980" y="492" fill="#94a3b8" font-size="11">⏱ 847 ms</text>
  <text x="980" y="510" fill="#94a3b8" font-size="11">📝 42 tokens</text>
  <text x="980" y="528" fill="#94a3b8" font-size="11">🤖 llama3.2</text>
</svg>
