<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="-apple-system,Segoe UI,monospace">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="url(#bg2)"/>

  <text x="500" y="44" text-anchor="middle" fill="#f1f5f9" font-size="24" font-weight="700" font-family="-apple-system,sans-serif">API Request Flow · Chat Completion</text>

  <!-- Request box -->
  <g>
    <rect x="40" y="80" width="430" height="240" rx="12" fill="#1e293b" stroke="#475569"/>
    <rect x="40" y="80" width="430" height="32" rx="12" fill="#334155"/>
    <circle cx="58" cy="96" r="5" fill="#ef4444"/>
    <circle cx="74" cy="96" r="5" fill="#f59e0b"/>
    <circle cx="90" cy="96" r="5" fill="#10b981"/>
    <text x="255" y="100" text-anchor="middle" fill="#cbd5e1" font-size="12">Request</text>

    <text x="60" y="140" fill="#f59e0b" font-size="13">POST</text>
    <text x="100" y="140" fill="#e2e8f0" font-size="13">/api/v1/chat/completions</text>

    <text x="60" y="170" fill="#94a3b8" font-size="12">X-API-Key:</text>
    <text x="160" y="170" fill="#10b981" font-size="12">your-api-key</text>

    <text x="60" y="190" fill="#94a3b8" font-size="12">Content-Type:</text>
    <text x="180" y="190" fill="#e2e8f0" font-size="12">application/json</text>

    <rect x="60" y="200" width="390" height="110" rx="6" fill="#0f172a"/>
    <text x="72" y="220" fill="#7dd3fc" font-size="12">{</text>
    <text x="84" y="238" fill="#94a3b8" font-size="12">"model":</text>
    <text x="148" y="238" fill="#fbbf24" font-size="12">"llama3.2"</text>
    <text x="216" y="238" fill="#cbd5e1" font-size="12">,</text>
    <text x="84" y="256" fill="#94a3b8" font-size="12">"messages":</text>
    <text x="170" y="256" fill="#cbd5e1" font-size="12">[</text>
    <text x="96" y="274" fill="#cbd5e1" font-size="12">{ "role":</text>
    <text x="170" y="274" fill="#fbbf24" font-size="12">"user"</text>
    <text x="208" y="274" fill="#cbd5e1" font-size="12">, "content":</text>
    <text x="290" y="274" fill="#fbbf24" font-size="12">"Hello!"</text>
    <text x="346" y="274" fill="#cbd5e1" font-size="12"> }</text>
    <text x="84" y="292" fill="#cbd5e1" font-size="12">]</text>
    <text x="72" y="304" fill="#7dd3fc" font-size="12">}</text>
  </g>

  <!-- Arrow to gateway -->
  <line x1="475" y1="200" x2="540" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Gateway pipeline -->
  <g>
    <rect x="540" y="80" width="420" height="240" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="750" y="105" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="700" font-family="-apple-system,sans-serif">Gateway Pipeline</text>

    <g font-family="-apple-system,sans-serif">
      <circle cx="565" cy="135" r="12" fill="#10b981"/>
      <text x="565" y="140" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1</text>
      <text x="585" y="140" fill="#d1fae5" font-size="13">Verify API key against .env API_KEYS</text>

      <circle cx="565" cy="170" r="12" fill="#10b981"/>
      <text x="565" y="175" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2</text>
      <text x="585" y="175" fill="#d1fae5" font-size="13">Validate JSON schema (Pydantic)</text>

      <circle cx="565" cy="205" r="12" fill="#10b981"/>
      <text x="565" y="210" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3</text>
      <text x="585" y="210" fill="#d1fae5" font-size="13">Classify model → text</text>

      <circle cx="565" cy="240" r="12" fill="#10b981"/>
      <text x="565" y="245" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">4</text>
      <text x="585" y="245" fill="#d1fae5" font-size="13">Forward to Ollama (httpx async)</text>

      <circle cx="565" cy="275" r="12" fill="#10b981"/>
      <text x="565" y="280" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">5</text>
      <text x="585" y="280" fill="#d1fae5" font-size="13">Stream / shape response back</text>
    </g>
  </g>

  <!-- Down arrow -->
  <line x1="750" y1="335" x2="750" y2="380" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="750" y1="335" x2="255" y2="380" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr2)"/>

  <!-- Response box -->
  <g>
    <rect x="40" y="385" width="920" height="200" rx="12" fill="#1e293b" stroke="#475569"/>
    <rect x="40" y="385" width="920" height="32" rx="12" fill="#334155"/>
    <circle cx="58" cy="401" r="5" fill="#ef4444"/>
    <circle cx="74" cy="401" r="5" fill="#f59e0b"/>
    <circle cx="90" cy="401" r="5" fill="#10b981"/>
    <text x="500" y="405" text-anchor="middle" fill="#cbd5e1" font-size="12">Response · 200 OK</text>

    <rect x="60" y="430" width="880" height="140" rx="6" fill="#0f172a"/>
    <text x="72" y="452" fill="#7dd3fc" font-size="13">{</text>
    <text x="84" y="472" fill="#94a3b8" font-size="13">"model":</text>
    <text x="160" y="472" fill="#fbbf24" font-size="13">"llama3.2"</text>
    <text x="232" y="472" fill="#cbd5e1" font-size="13">,</text>
    <text x="84" y="492" fill="#94a3b8" font-size="13">"message":</text>
    <text x="170" y="492" fill="#cbd5e1" font-size="13">{ "role":</text>
    <text x="248" y="492" fill="#fbbf24" font-size="13">"assistant"</text>
    <text x="328" y="492" fill="#cbd5e1" font-size="13">, "content":</text>
    <text x="416" y="492" fill="#fbbf24" font-size="13">"Hello! How can I help you today?"</text>
    <text x="688" y="492" fill="#cbd5e1" font-size="13"> },</text>
    <text x="84" y="512" fill="#94a3b8" font-size="13">"eval_count":</text>
    <text x="184" y="512" fill="#a78bfa" font-size="13">12</text>
    <text x="200" y="512" fill="#cbd5e1" font-size="13">,</text>
    <text x="84" y="532" fill="#94a3b8" font-size="13">"total_duration":</text>
    <text x="216" y="532" fill="#a78bfa" font-size="13">847261000</text>
    <text x="296" y="532" fill="#94a3b8" font-size="13">  // nanoseconds</text>
    <text x="72" y="552" fill="#7dd3fc" font-size="13">}</text>
  </g>

  <text x="500" y="605" text-anchor="middle" fill="#64748b" font-size="11" font-family="-apple-system,sans-serif">github.com/israfeelmasum/ollama-api-gateway</text>
</svg>
