<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system,Segoe UI,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ollama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="50" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="700">Ollama API Gateway · Architecture</text>
  <text x="500" y="78" text-anchor="middle" fill="#94a3b8" font-size="14">Stateless FastAPI proxy in front of Ollama with auth, validation, and OpenAI-compatible endpoints</text>

  <!-- Clients -->
  <g>
    <rect x="60" y="180" width="180" height="200" rx="14" fill="url(#client)" stroke="#1e40af" stroke-width="1"/>
    <text x="150" y="215" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Clients</text>
    <text x="150" y="248" text-anchor="middle" fill="#dbeafe" font-size="12">Web apps</text>
    <text x="150" y="270" text-anchor="middle" fill="#dbeafe" font-size="12">Mobile apps</text>
    <text x="150" y="292" text-anchor="middle" fill="#dbeafe" font-size="12">Python / Node</text>
    <text x="150" y="314" text-anchor="middle" fill="#dbeafe" font-size="12">cURL</text>
    <text x="150" y="336" text-anchor="middle" fill="#dbeafe" font-size="12">Streamlit UI</text>
    <text x="150" y="358" text-anchor="middle" fill="#dbeafe" font-size="12">3rd-party tools</text>
  </g>

  <!-- HTTPS arrow -->
  <line x1="240" y1="280" x2="370" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="270" text-anchor="middle" fill="#cbd5e1" font-size="12">HTTPS + API Key</text>

  <!-- Gateway -->
  <g>
    <rect x="370" y="140" width="280" height="280" rx="14" fill="url(#api)" stroke="#047857" stroke-width="1"/>
    <text x="510" y="180" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">FastAPI Gateway</text>
    <text x="510" y="200" text-anchor="middle" fill="#d1fae5" font-size="11">Stateless · Async · OpenAPI</text>

    <rect x="390" y="220" width="240" height="32" rx="6" fill="rgba(255,255,255,.12)"/>
    <text x="510" y="241" text-anchor="middle" fill="#fff" font-size="13">🔐 Auth Middleware (X-API-Key / Bearer)</text>

    <rect x="390" y="258" width="240" height="32" rx="6" fill="rgba(255,255,255,.12)"/>
    <text x="510" y="279" text-anchor="middle" fill="#fff" font-size="13">📋 Pydantic Validation</text>

    <rect x="390" y="296" width="240" height="32" rx="6" fill="rgba(255,255,255,.12)"/>
    <text x="510" y="317" text-anchor="middle" fill="#fff" font-size="13">🧠 Model Type Classifier</text>

    <rect x="390" y="334" width="240" height="32" rx="6" fill="rgba(255,255,255,.12)"/>
    <text x="510" y="355" text-anchor="middle" fill="#fff" font-size="13">⚡ SSE Streaming Proxy</text>

    <rect x="390" y="372" width="240" height="32" rx="6" fill="rgba(255,255,255,.12)"/>
    <text x="510" y="393" text-anchor="middle" fill="#fff" font-size="13">📊 Batch Embeddings</text>
  </g>

  <!-- Internal arrow -->
  <line x1="650" y1="280" x2="780" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="270" text-anchor="middle" fill="#cbd5e1" font-size="12">Internal HTTP</text>

  <!-- Ollama -->
  <g>
    <rect x="780" y="180" width="170" height="200" rx="14" fill="url(#ollama)" stroke="#5b21b6" stroke-width="1"/>
    <text x="865" y="215" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Ollama</text>
    <text x="865" y="245" text-anchor="middle" fill="#ede9fe" font-size="12">llama3.2</text>
    <text x="865" y="265" text-anchor="middle" fill="#ede9fe" font-size="12">qwen3.5</text>
    <text x="865" y="285" text-anchor="middle" fill="#ede9fe" font-size="12">gemma4</text>
    <text x="865" y="305" text-anchor="middle" fill="#ede9fe" font-size="12">qwen3-vl</text>
    <text x="865" y="325" text-anchor="middle" fill="#ede9fe" font-size="12">nomic-embed</text>
    <text x="865" y="350" text-anchor="middle" fill="#a78bfa" font-size="11">🎮 NVIDIA GPU</text>
  </g>

  <!-- Bottom badges -->
  <g font-size="12">
    <rect x="60" y="450" width="120" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="120" y="470" text-anchor="middle" fill="#cbd5e1">🐳 Docker</text>

    <rect x="190" y="450" width="120" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="250" y="470" text-anchor="middle" fill="#cbd5e1">🔒 Traefik + SSL</text>

    <rect x="320" y="450" width="120" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="380" y="470" text-anchor="middle" fill="#cbd5e1">⚡ FastAPI</text>

    <rect x="450" y="450" width="120" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="510" y="470" text-anchor="middle" fill="#cbd5e1">🎈 Streamlit UI</text>

    <rect x="580" y="450" width="120" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="640" y="470" text-anchor="middle" fill="#cbd5e1">🔓 API Keys</text>

    <rect x="710" y="450" width="120" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="770" y="470" text-anchor="middle" fill="#cbd5e1">📡 Streaming</text>

    <rect x="840" y="450" width="110" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="895" y="470" text-anchor="middle" fill="#cbd5e1">🖼️ Vision</text>
  </g>

  <text x="500" y="525" text-anchor="middle" fill="#64748b" font-size="11">github.com/israfeelmasum/ollama-api-gateway</text>
</svg>
